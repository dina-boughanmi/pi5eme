<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Job Manager Test Interface</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, button { margin: 5px 0; padding: 5px; }
    .job { border: 1px solid #ccc; padding: 10px; margin-bottom: 5px; }
  </style>
</head>
<body>
  <h1>Job Manager Test</h1>

  <h2>Add Job</h2>
  <input id="title" placeholder="Title" /><br>
  <input id="company" placeholder="Company" /><br>
  <input id="location" placeholder="Location" /><br>
  <input id="salary" placeholder="Salary" /><br>
  <input id="description" placeholder="Description" /><br>
  <input id="skills" placeholder="Skills" /><br>
  <button onclick="addJob()">Add Job</button>

  <h2>Jobs List</h2>
  <div id="jobsList"></div>

  <script>
    const apiUrl = "http://localhost:3000/api/jobs"; // adapter si votre serveur est ailleurs

    async function fetchJobs() {
      const res = await fetch(apiUrl);
      const jobs = await res.json();
      const container = document.getElementById('jobsList');
      container.innerHTML = '';
      jobs.forEach(job => {
        const div = document.createElement('div');
        div.className = 'job';
        div.innerHTML = `
          <strong>${job.title}</strong> - ${job.company}<br>
          Location: ${job.location} | Salary: ${job.salary}<br>
          Description: ${job.description}<br>
          Skills: ${job.skills}<br>
          <button onclick="editJob(${job.id})">Edit</button>
          <button onclick="deleteJob(${job.id})">Delete</button>
        `;
        container.appendChild(div);
      });
    }

    async function addJob() {
      const job = {
        title: document.getElementById('title').value,
        company: document.getElementById('company').value,
        location: document.getElementById('location').value,
        salary: document.getElementById('salary').value,
        description: document.getElementById('description').value,
        skills: document.getElementById('skills').value
      };
      const res = await fetch(apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(job)
      });
      const data = await res.json();
      console.log(data);
      fetchJobs();
    }

    async function deleteJob(id) {
      if (!confirm('Delete this job?')) return;
      const res = await fetch(apiUrl, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      const data = await res.json();
      console.log(data);
      fetchJobs();
    }

    async function editJob(id) {
      const newTitle = prompt("New title?");
      if (!newTitle) return;
      const res = await fetch(apiUrl, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, title: newTitle })
      });
      const data = await res.json();
      console.log(data);
      fetchJobs();
    }

    fetchJobs(); // initial load
  </script>
</body>
</html>
